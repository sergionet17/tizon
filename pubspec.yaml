name: tizon_app
description: "App de producción y bonos de biocarbón"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  
  # State Management
  provider: ^6.1.2
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  # Google Sign In
  google_sign_in: ^6.2.1
  # (opcionales; puedes omitirlos)
  google_sign_in_android: ^6.1.30
  google_sign_in_ios: ^5.7.6
  
  # Navigation
  go_router: ^14.8.1
  
  # Base de datos local (Offline) — Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilidades
  path_provider: ^2.1.4
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generación de código para Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # assets:
  #   - images/
  #   - assets/
