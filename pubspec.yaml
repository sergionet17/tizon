name: tizon_app
description: "App de producción y bonos de biocarbón"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.3
  google_maps_flutter: ^2.14.0  # Añade esta línea

  # State Management (elige 1: Provider o BLoC; puedes dejar ambos, pero mejor 1)
  provider: ^6.1.5+1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # FP / Helpers
  dartz: ^0.10.1
  get_it: ^7.7.0

  # Network
  connectivity_plus: ^6.1.5
  internet_connection_checker: ^1.0.0+1

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5

  # Google Sign In
  google_sign_in: ^6.3.0
  # opcionales (si los usas directo)
  google_sign_in_android: ^6.2.1
  google_sign_in_ios: ^5.9.0

  # Navigation
  go_router: ^14.8.1

  # Base de datos local (Offline) — Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilidades
  path_provider: ^2.1.5
  geolocator: ^13.0.4
  permission_handler: ^11.4.0
  image_picker: ^1.2.1
  camera: ^0.11.3
  uuid: ^4.5.2
  intl: ^0.19.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generación de código para Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
